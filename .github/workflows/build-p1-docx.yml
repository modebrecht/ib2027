name: Build P1 DOCX

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'hw/create_p1_docx.py'
      - 'hw/apply_p1_didactic_fixes.py'
      - 'hw/add_p1_bonus.py'
      - 'hw/compact_p1_docx.py'
      - 'hw/fix_p1_docx_layout.py'
      - 'hw/validate_p1_docx.py'
      - 'hw/sync_p1_index.py'
      - 'scripts/enforce_p1_docx_readability.py'
      - '.github/workflows/build-p1-docx.yml'

permissions:
  contents: write

concurrency:
  group: p1-docx-dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install python-docx

      - name: Build, compact and validate DOCX
        run: |
          python hw/create_p1_docx.py
          python hw/apply_p1_didactic_fixes.py
          python hw/add_p1_bonus.py
          python hw/compact_p1_docx.py
          python hw/fix_p1_docx_layout.py
          python scripts/enforce_p1_docx_readability.py hw/P1.docx
          python hw/validate_p1_docx.py
          python hw/sync_p1_index.py

      - name: Upload DOCX for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: p1-docx
          path: hw/P1.docx
          if-no-files-found: error

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/P1.docx index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build P1 DOCX and sync index"
          git pull --rebase origin dev
          git push origin HEAD:dev
